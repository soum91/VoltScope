name: iOS unsigned IPA
on:
  push:
    branches: [main]
    paths-ignore:
      - repo.json
      - source.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify installed version UI contract
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 "$GITHUB_WORKSPACE/scripts/check_version_ui.py"
          else
            python "$GITHUB_WORKSPACE/scripts/check_version_ui.py"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iPhone
        run: |
          set -o pipefail
          xcodebuild -project VoltScope.xcodeproj -scheme VoltScope \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION="1.1.${GITHUB_RUN_NUMBER}" build
      - name: Verify and normalize embedded app versions
        run: |
          version="1.1.${GITHUB_RUN_NUMBER}"
          for info in \
            build/Build/Products/Release-iphoneos/VoltScope.app/Info.plist \
            build/Build/Products/Release-iphoneos/VoltScope.app/PlugIns/VoltScopeWidget.appex/Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$info"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$info"
            actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")
            build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")
            test "$actual" = "$version"
            test "$build" = "$GITHUB_RUN_NUMBER"
          done
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VoltScope.app Payload/
          zip -qry VoltScope-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltScope-unsigned-ipa
          path: VoltScope-unsigned.ipa
          if-no-files-found: error
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.1.${GITHUB_RUN_NUMBER}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" VoltScope-unsigned.ipa \
              --title "VoltScope 1.1.${GITHUB_RUN_NUMBER}" \
              --notes "Unsigned iPhone IPA. Sign before sideloading. Battery Detective in Insights reads user-selected iOS Battery Usage screenshots via native Photos or Files pickers with offline OCR; app shares and background activity are labeled as Apple's statistics, not live per-process watts. Keeps real HID charger/cell power readings, FindMyBLE integration and device-ring widgets."
      - name: Refresh FlareStore feed
        run: |
          python3 .github/scripts/publish_feed.py VoltScope-unsigned.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json source.json
          if ! git diff --cached --quiet; then
            git commit -m "catalog: publish VoltScope build ${GITHUB_RUN_NUMBER} [skip ci]"
            git push
          fi
